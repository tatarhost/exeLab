<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>WorkInk Browser</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div class="controls">
      <button id="back" type="button" aria-label="Назад" title="Назад" disabled>‹</button>
      <button id="forward" type="button" aria-label="Вперёд" title="Вперёд" disabled>›</button>
      <button id="reload" type="button" aria-label="Обновить" title="Обновить">↻</button>
      <button id="home" type="button" aria-label="Домой" title="Домой">⌂</button>
    </div>
    <form id="address-form" autocomplete="off">
      <span class="site-mark" aria-hidden="true">◎</span>
      <input id="address" type="text" spellcheck="false" autocapitalize="off"
        autocomplete="url" aria-label="Адрес сайта" placeholder="Введите адрес сайта">
      <button class="go" type="submit" aria-label="Перейти">→</button>
    </form>
  </header>
  <div id="status" role="status" aria-live="polite"></div>
</body>
</html>
