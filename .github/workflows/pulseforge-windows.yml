name: Build PulseForge Lite for Windows

on:
  push:
    branches: ["pulseforge-lite"]
    paths:
      - "PulseForge-build-source.part09"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reassemble and unpack source bundle
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem -LiteralPath . -Filter "PulseForge-build-source.part*" | Sort-Object Name)
          if ($parts.Count -ne 9) { throw "Expected 9 source bundle parts, found $($parts.Count)." }
          $encoded = (($parts | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join "")
          [IO.File]::WriteAllBytes("PulseForge-build-source.tar.gz", [Convert]::FromBase64String($encoded))
          tar -xzf PulseForge-build-source.tar.gz

      - name: Restore and publish single-file app
        run: dotnet publish PulseForge/PulseForge.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-Lite-Windows-x64
          path: publish/PulseForge.exe
          if-no-files-found: error
          retention-days: 14
